name: Validate Jekyll site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Verify generated pages and brand isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/uslugi/index.html
          test -f _site/uslugi/podbor-ipoteki/index.html
          test -f _site/uslugi/semeynaya-ipoteka/index.html
          test -f _site/uslugi/ipoteka-na-stroitelstvo-doma/index.html
          test -f _site/uslugi/otkazali-v-ipoteke/index.html
          test -f _site/kontakty/index.html
          test -f _site/faq/index.html
          test -f _site/geo/balashov/index.html
          test -f _site/geo/rossiya/index.html
          test -f _site/politika-konfidencialnosti/index.html
          ! grep -R "Татьяна Стерликова\|sterlikova-ipoteka.ru\|89030250807\|8 903 025-08-07" _site --include='*.html'
          grep -q "Людмила Соседова" _site/index.html
          grep -q "Соседова Ипотека" _site/index.html

      - name: Check JavaScript syntax
        run: node --check assets/js/site.js
